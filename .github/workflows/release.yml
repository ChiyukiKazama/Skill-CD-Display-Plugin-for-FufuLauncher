name: Build and release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (major.minor.patch, e.g. 1.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version and tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $release = ./scripts/Get-ReleaseVersion.ps1 -Version $env:REQUESTED_VERSION
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT

      - name: Locate MSBuild
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found.' }
          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV

      - name: Build Release x64
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -MSBuildPath $env:MSBUILD_PATH -Version $env:RELEASE_VERSION

      - name: Compress DLL with UPX and verify integrity and loading
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Compress-Release.ps1

      - name: Create release package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./publish.ps1 -Version $env:RELEASE_VERSION -DllPath ./obj/release/DisplayCD.dll

      - name: Verify package, versions and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Verify-Release.ps1 -ExpectedVersion $env:RELEASE_VERSION -RequireCompression

      - name: Save completed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist

      - name: Publish ZIP after all checks pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Preserve published versions. Only an explicit manual run may publish.
          if state=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.draft' 2>release-lookup-error.log); then
            if [[ "$state" == "false" ]]; then
              echo "Release $RELEASE_TAG already exists; skipping duplicate publication."
              exit 0
            fi
            echo "::error::An unpublished draft for $RELEASE_TAG exists. Remove or finish that draft before publishing this version."
            exit 1
          elif ! grep -q 'HTTP 404' release-lookup-error.log; then
            cat release-lookup-error.log >&2
            exit 1
          fi
          archive="dist/DisplayCD-$RELEASE_VERSION.zip"
          test -f "$archive"
          # Only the finished ZIP is attached; auxiliary files stay in Actions artifacts.
          gh release create "$RELEASE_TAG" "$archive" \
            --target "$SOURCE_SHA" --title "DisplayCD $RELEASE_VERSION" \
            --draft --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
